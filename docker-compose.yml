services:
  postgres:
    image: postgres:16-alpine
    container_name: likewhat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: likewhat
      POSTGRES_USER: likewhat
      POSTGRES_PASSWORD: likewhat_dev_password
    ports:
      # 5432 on the host is taken by a local postgres / ssh tunnel, so the
      # container is published on 5433 instead.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
